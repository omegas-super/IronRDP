<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>swastik-rdp</title>
<style>
:root { color-scheme: light dark; --bg:#0b1017; --panel:#151d28; --line:#26344a; --text:#e8eef7; --muted:#9fb0c8; --good:#59d98a; --bad:#ff6b7a; --accent:#6aa9ff; }
* { box-sizing:border-box }
body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif; }
main { max-width:900px; margin:40px auto; padding:0 20px; }
h1 { margin:0 0 4px; font-size:26px; letter-spacing:.3px }
p.sub { margin:0 0 24px; color:var(--muted) }
.card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:18px }
label { display:block; color:var(--muted); margin:12px 0 4px; font-size:13px }
input,select { width:100%; padding:10px 12px; background:#0d141e; color:var(--text); border:1px solid var(--line); border-radius:8px; font:inherit }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:12px }
.row { display:flex; gap:12px; align-items:center; margin-top:20px }
button { padding:11px 22px; border:0; border-radius:8px; background:var(--accent); color:#07101e; font-weight:700; cursor:pointer }
button:disabled { opacity:.5; cursor:wait }
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px }
.stat { background:#0d141e; border:1px solid var(--line); padding:14px; border-radius:10px }
.stat b { display:block; font-size:24px; margin-top:4px }
.good { color:var(--good) } .bad { color:var(--bad) }
code { color:var(--accent); word-break:break-all }
.note { color:var(--muted); font-size:13px }
</style>
</head>
<body><main>
<h1>swastik-rdp</h1>
<p class="sub">Authorized credential audit · local interface · reports stay on this machine</p>
<section class="card">
<strong>Inputs</strong>
<label>Hosts file — one <code>ip[:port]</code> per line</label><input id="hosts" placeholder="C:\audits\hosts.txt">
<div class="grid">
<div><label>Users file</label><input id="users" placeholder="C:\audits\users.txt"></div>
<div><label>Passwords file</label><input id="passwords" type="password" placeholder="C:\audits\passwords.txt"></div>
</div>
<div class="grid">
<div><label>Domains file (optional)</label><input id="domains" placeholder="blank = none"></div>
<div><label>Output directory</label><input id="output_dir" value="swastik-results"></div>
</div>
<label>Performance profile</label>
<select id="profile">
<option value="0">0 — MAX (full spec-derived ceiling)</option>
<option value="1">1 — Conservative</option>
<option value="2" selected>2 — Balanced (adaptive)</option>
<option value="3">3 — Aggressive</option>
<option value="4">4 — Custom</option>
</select>
<div class="grid" id="advanced" hidden>
<div><label>Concurrency (0 = adaptive)</label><input id="concurrency" type="number" min="0" value="0"></div>
<div><label>Per-host limit</label><input id="per_host" type="number" min="1" value="8"></div>
<div><label>Timeout (ms)</label><input id="timeout_ms" type="number" min="1" value="10000"></div>
<div><label>Connect timeout (ms)</label><input id="connect_timeout_ms" type="number" min="1" value="5000"></div>
<div><label>Pre-auth retries (0-2)</label><input id="retries" type="number" min="0" max="2" value="0"></div>
</div>
<div class="row"><button id="start">Start audit</button><span class="note" id="message"></span></div>
</section>
<section class="card">
<strong>Progress</strong>
<div class="stats">
<div class="stat">State<b id="s-state">idle</b></div>
<div class="stat">Completed<b id="s-done">0 / 0</b></div>
<div class="stat">Valid<b id="s-valid" class="good">0</b></div>
<div class="stat">Invalid<b id="s-invalid" class="bad">0</b></div>
<div class="stat">Errors<b id="s-errors">0</b></div>
<div class="stat">Concurrency<b id="s-concurrency">0</b></div>
</div>
<p class="note" id="elapsed"></p>
<p class="note">Results: <code>goods.txt</code>, <code>bad.txt</code>, <code>errors.txt</code>, <code>summary.ndjson</code> in the output directory. Existing reports are never overwritten.</p>
</section>
<script>
const fields = ['hosts','users','passwords','domains','output_dir','profile','concurrency','per_host','timeout_ms','connect_timeout_ms','retries'];
const el = id => document.getElementById(id);
el('profile').addEventListener('change', () => el('advanced').hidden = el('profile').value !== '4');
el('start').addEventListener('click', async () => {
  el('message').textContent = '';
  const payload = Object.fromEntries(fields.map(id => [id, el(id).value]));
  el('start').disabled = true;
  try {
    const response = await fetch('/api/start', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
    const data = await response.json();
    el('message').textContent = data.ok ? 'Started' : (data.error || 'Failed');
  } catch (error) { el('message').textContent = String(error); }
  el('start').disabled = false;
});
async function poll() {
  try {
    const payload = await (await fetch('/api/progress', {cache:'no-store'})).json();
    const progress = payload.progress;
    if (payload.error) el('message').textContent = payload.error;
    el('s-state').textContent = progress.state;
    el('s-done').textContent = progress.completed + ' / ' + progress.total;
    el('s-valid').textContent = progress.valid;
    el('s-invalid').textContent = progress.invalid;
    el('s-errors').textContent = progress.errors;
    el('s-concurrency').textContent = progress.concurrency;
    el('elapsed').textContent = progress.elapsed_ms ? ('Elapsed: ' + (progress.elapsed_ms/1000).toFixed(1) + ' s') : '';
  } catch (_) {}
  setTimeout(poll, 600);
}
poll();
</script>
</main></body></html>
